name: Commerce verification
on:
  push:
    branches: [feat/day-02-commerce, feat/workspaces-channel-sandbox, feat/exclusive-account-roles, main]
  pull_request:
jobs:
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-ci-test-only
          POSTGRES_DB: agricitest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agricitest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: local-ci-test-only
      PGDATABASE: agricitest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run migrations and transactional acceptance in disposable PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/bootstrap.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
          psql -v ON_ERROR_STOP=1 -f tests/sql/commerce.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-link.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-harvest.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/fpo-alerts.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-guide.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/whatsapp-operations.sql

      - name: Verify signed ONDC lifecycle on disposable shared commerce database
        env:
          ONDC_DISPOSABLE_CI: '1'
        run: |
          psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -f tests/sql/ondc-local-commerce.sql
          node tests/ondc-db.mjs
