name: WhatsApp relay verification
on:
  push:
    branches: [feat/whatsapp-05-relay, feat/whatsapp-05-advanced, main]
  pull_request:
    paths:
      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/whatsapp-relay.yml'
jobs:
  transport:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/whatsapp*.test.mjs
      - name: Verify optional voice service request contract
        run: python3 -m unittest discover -s services/whatsapp-voice -p 'test_*.py'
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: relay-ci-test-only
          POSTGRES_DB: agricitest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agricitest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: relay-ci-test-only
      PGDATABASE: agricitest
    steps:
      - uses: actions/checkout@v4
      - name: Run all migrations and WhatsApp SQL acceptance tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/bootstrap.sql
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
          for f in tests/sql/whatsapp-*.sql; do psql -v ON_ERROR_STOP=1 -f "$f"; done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify competing SQL transactions
        env:
          WA_DISPOSABLE_CI: '1'
        run: node tests/whatsapp-concurrency.mjs
